# SMS Gate Private Server
# Docs: https://docs.sms-gate.app/getting-started/private-server/
#
# Phone Cloud Server settings:
#   API URL: https://smsgate.fcconnect.co/api/mobile/v1
#   Private Token: must match gateway.private_token below
#
# Orchestrator .env:
#   SMS_GATEWAY_MODE=private
#   SMS_GATEWAY_URL=https://smsgate.fcconnect.co
#   SMS_GATEWAY_USER / PASSWORD = credentials shown in the app after Online

gateway:
  mode: private
  # CHANGE THIS — must match the Private Token typed into the Android app
  private_token: "REPLACE_WITH_LONG_RANDOM_TOKEN"

http:
  listen: 0.0.0.0:3000

database:
  host: smsgate-db
  port: 3306
  user: sms
  password: "REPLACE_WITH_SMSGATE_DB_PASSWORD"
  database: sms
  timezone: UTC
